<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="Cena original de fliperama neon dos anos 90, sem personagens de franquia">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120628"/>
      <stop offset="55%" stop-color="#2a0b5f"/>
      <stop offset="100%" stop-color="#4a146e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0b0714"/>
    </linearGradient>
    <linearGradient id="cabA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#6d00ff"/>
    </linearGradient>
    <linearGradient id="cabB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe14a"/>
